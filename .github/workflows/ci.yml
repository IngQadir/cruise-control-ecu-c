name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-analyze:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake cppcheck lcov

      - name: Configure (strict warnings, warnings are errors)
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Static analysis (cppcheck)
        run: cmake --build build --target cppcheck

      - name: Build with coverage
        run: |
          cmake -S . -B build-cov -DENABLE_COVERAGE=ON
          cmake --build build-cov

      - name: Run tests with coverage
        run: ctest --test-dir build-cov --output-on-failure

      - name: Coverage report (fails below 90 % line coverage)
        run: |
          lcov --capture --directory build-cov --output-file build-cov/coverage.info
          lcov --extract build-cov/coverage.info "*/src/*" --output-file build-cov/coverage_src.info
          genhtml build-cov/coverage_src.info --output-directory build-cov/html
          lcov --summary build-cov/coverage_src.info --fail-under-lines 90

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build-cov/html
          